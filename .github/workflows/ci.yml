name: CI

on:
  # No `branches:` filter here on purpose. This repo uses a stacked-PR
  # workflow where a PR's base is often another feature branch, not main
  # (e.g. PR #4's base is PR #3's branch, not main) -- a `branches: [main]`
  # filter, which matches on the PR's *base* ref, silently skipped CI for
  # every one of those PRs. Confirmed via `gh run list`: this workflow had
  # run exactly once, ever, despite three open stacked PRs.
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI spec is up to date
        run: |
          pnpm --filter @mapee/contracts run generate
          git diff --exit-code -- packages/contracts/openapi.json

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Intentionally run without secrets: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
      # SUPABASE_SERVICE_ROLE_KEY, ENCRYPTION_KEY, OPENCELLID_API_KEY, IPINFO_TOKEN,
      # UPSTASH_REDIS_REST_URL, and UPSTASH_REDIS_REST_TOKEN are all unset here. This proves that
      # apps/web's no-database/no-external-service degradation path still compiles successfully
      # even when none of these integrations are configured.
      - name: Build
        run: pnpm build

      # Guards the exact class of bug CRITICAL CONTEXT in apps/api/README.md
      # describes: a change that typechecks and passes tests under tsx/vitest
      # (both lenient about extensionless relative imports) but breaks when
      # actually run, since apps/api's "type": "module" package.json means
      # Node's own ESM loader is not lenient about it. Starts the real `start`
      # script (tsx, not a `dist/` build — see the README for why) and hits
      # the real HTTP server it boots, rather than trusting `app.fetch()`
      # from within a test process.
      - name: Smoke test apps/api actually starts
        run: |
          pnpm --filter @mapee/api start &
          API_PID=$!

          ready=false
          for i in $(seq 1 20); do
            if response=$(curl -sf http://localhost:8787/healthz); then
              ready=true
              break
            fi
            sleep 0.5
          done

          if [ "$ready" != "true" ]; then
            echo "apps/api never responded to /healthz"
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi

          if [ "$response" != '{"status":"ok"}' ]; then
            echo "unexpected /healthz response: $response"
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi

          kill "$API_PID"
          wait "$API_PID" 2>/dev/null || true
          echo "apps/api responded correctly and was stopped"

  mobile:
    name: Mobile — analyze, test, build (Track B Phase 0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (for openapi-generator-cli)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # apps/mobile/packages/mapee_api is generated, not committed (mirrors
      # the generated TS client's git-ignored status) -- CI regenerates it
      # from the committed openapi.json, same as `generate:dart-client`
      # (packages/contracts/package.json) does locally. This is also a
      # drift check: if the spec and the mobile code have diverged, this is
      # where a broken route/model shows up.
      - name: Generate Dart API client
        run: |
          npx --yes @openapitools/openapi-generator-cli@2.40.1 generate \
            -i packages/contracts/openapi.json \
            -g dart-dio \
            -o apps/mobile/packages/mapee_api \
            --additional-properties=pubName=mapee_api,pubLibrary=mapee_api
          cd apps/mobile/packages/mapee_api
          dart pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Install mobile dependencies
        run: cd apps/mobile && flutter pub get

      - name: Analyze
        run: cd apps/mobile && flutter analyze

      # test/design/golden/**'s baseline PNGs were generated locally on
      # macOS; ubuntu-latest's Skia/font rendering produces small (~0.02-0.12%)
      # pixel diffs against them on every single golden test, confirmed by
      # actually seeing a real CI run fail this way -- not a real visual
      # regression, a cross-platform rendering mismatch. Golden tests stay a
      # local pre-merge check (`flutter test test/design/golden`) rather than
      # a CI one, short of running CI in a container matching the exact
      # environment the baselines were generated in.
      - name: Test
        run: cd apps/mobile && flutter test $(find test -name '*_test.dart' -not -path '*/golden/*')

      # Android only for now: a real compiled artifact, no codesigning
      # needed, runs on the same ubuntu runner as everything else above.
      # iOS builds need a macOS runner and codesigning setup -- deferred
      # until that's actually worth the extra CI cost.
      - name: Build (Android debug APK)
        run: cd apps/mobile && flutter build apk --debug

  deploy-api:
    name: Deploy apps/api (Railway)
    needs: ci
    # Only after the ci job passes, and only for a real push to main -- never
    # for a pull_request event (a PR from a fork wouldn't have access to the
    # secret anyway, and a PR shouldn't deploy regardless). This is what
    # actually makes this CD rather than just Railway's own git integration
    # racing an untested commit into production the moment it's pushed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # apps/api runs via tsx directly against TypeScript source in
      # production (see apps/api/README.md's "Two things that are easy to
      # get wrong here" -- @mapee/core and @mapee/contracts have no build
      # step of their own, so a dist/-based deploy of apps/api alone would
      # resolve at compile time and then fail to load its own workspace
      # dependencies at runtime). Railway therefore needs the whole
      # workspace, not apps/api in isolation -- root-level railway.json's
      # buildCommand/startCommand reflect that, the same lesson already
      # learned the hard way with apps/web's Vercel Root Directory setting.
      # --ci streams build logs then exits non-interactively (real flag,
      # verified against `railway up --help` in @railway/cli 5.30.4 rather
      # than assumed). --service/--environment are explicit rather than
      # relying on whatever's linked, since nothing is ever `railway link`ed
      # in a fresh CI runner. RAILWAY_TOKEN should be a *project* token
      # (Railway dashboard -> project -> Settings -> Tokens), which scopes
      # auth to this one project without needing an interactive login/link.
      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up --ci --service api --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
