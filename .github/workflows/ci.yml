name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI spec is up to date
        run: |
          pnpm --filter @mapee/contracts run generate
          git diff --exit-code -- packages/contracts/openapi.json

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Intentionally run without secrets: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
      # SUPABASE_SERVICE_ROLE_KEY, ENCRYPTION_KEY, OPENCELLID_API_KEY, IPINFO_TOKEN,
      # UPSTASH_REDIS_REST_URL, and UPSTASH_REDIS_REST_TOKEN are all unset here. This proves that
      # apps/web's no-database/no-external-service degradation path still compiles successfully
      # even when none of these integrations are configured.
      - name: Build
        run: pnpm build

      # Guards the exact class of bug CRITICAL CONTEXT in apps/api/README.md
      # describes: a change that typechecks and passes tests under tsx/vitest
      # (both lenient about extensionless relative imports) but breaks when
      # actually run, since apps/api's "type": "module" package.json means
      # Node's own ESM loader is not lenient about it. Starts the real `start`
      # script (tsx, not a `dist/` build — see the README for why) and hits
      # the real HTTP server it boots, rather than trusting `app.fetch()`
      # from within a test process.
      - name: Smoke test apps/api actually starts
        run: |
          pnpm --filter @mapee/api start &
          API_PID=$!

          ready=false
          for i in $(seq 1 20); do
            if response=$(curl -sf http://localhost:8787/healthz); then
              ready=true
              break
            fi
            sleep 0.5
          done

          if [ "$ready" != "true" ]; then
            echo "apps/api never responded to /healthz"
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi

          if [ "$response" != '{"status":"ok"}' ]; then
            echo "unexpected /healthz response: $response"
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi

          kill "$API_PID"
          wait "$API_PID" 2>/dev/null || true
          echo "apps/api responded correctly and was stopped"
